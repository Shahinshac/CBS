name: Validate Build

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install and Build Backend
        run: |
          cd backend
          npm install
          npx prisma generate
          npm run build

      - name: Install and Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
